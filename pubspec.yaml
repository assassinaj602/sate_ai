name: sate_ai
version: 0.1.2
description: A fault injection framework for testing on-device AI models in Flutter. Simulate memory pressure, malformed inputs, and degradation to catch failures before deployment.
homepage: https://github.com/assassinaj602/sate_ai
repository: https://github.com/assassinaj602/sate_ai
issue_tracker: https://github.com/assassinaj602/sate_ai/issues
documentation: https://pub.dev/documentation/sate_ai

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true

topics:
  - testing
  - ai
  - on-device
  - llm
  - fault-injection
