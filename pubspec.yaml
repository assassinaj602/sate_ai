name: sate_ai
version: 0.1.0
description: >-
  Test what happens when on-device AI models fail. 
  A fault injection framework for Flutter AI — catch OOM crashes, 
  malformed input failures, and thermal throttling before your users do.
homepage: https://github.com/YOUR_USERNAME/sate_ai
repository: https://github.com/YOUR_USERNAME/sate_ai
issue_tracker: https://github.com/YOUR_USERNAME/sate_ai/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  dotenv: ^4.2.0
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true

topics:
  - testing
  - ai
  - on-device
  - llm
  - fault-injection
