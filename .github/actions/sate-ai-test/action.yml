name: 'SATE AI Test'
description: 'Run SATE AI stress tests on your AI model'
author: 'assassinaj602'

inputs:
  model-path:
    description: 'Path to the AI model file'
    required: true
  injectors:
    description: 'Comma-separated list of injectors to use'
    required: false
    default: 'memoryPressure,malformedInput'
  timeout:
    description: 'Timeout in seconds for each test'
    required: false
    default: '30'
  output-format:
    description: 'Output format (json or markdown)'
    required: false
    default: 'json'

runs:
  using: 'composite'
  steps:
    # Flutter is required for `pub get` because pubspec.yaml depends on the
    # Flutter SDK. However, the CLI binary itself (bin/sate_ai.dart) only
    # imports pure-Dart code via sate_ai_cli.dart, so `dart run` works fine
    # and never triggers Flutter framework compilation.
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.3'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get
      shell: bash

    - name: Run SATE AI Stress Test
      run: |
        REPORT_EXT="json"
        MARKDOWN_FLAG=""
        if [ "${{ inputs.output-format }}" = "markdown" ]; then
          REPORT_EXT="md"
          MARKDOWN_FLAG="--markdown"
        fi
        dart run bin/sate_ai.dart \
          --model "${{ inputs.model-path }}" \
          --injectors "${{ inputs.injectors }}" \
          --timeout "${{ inputs.timeout }}" \
          --output "stress-report.${REPORT_EXT}" \
          ${MARKDOWN_FLAG}
      shell: bash

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: sate-ai-report
        path: stress-report.*
