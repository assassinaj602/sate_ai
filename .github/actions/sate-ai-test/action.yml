name: 'SATE AI Stress Test'
description: 'Run fault injection stress tests on on-device AI models in your CI/CD pipeline'
author: 'assassinaj602'

branding:
  icon: 'activity'
  color: 'indigo'

inputs:
  model-path:
    description: 'Path to the AI model file (e.g. .tflite, .onnx, or .gguf)'
    required: true
  injectors:
    description: 'Comma-separated list of injectors to use (e.g. memoryPressure,malformedInput,thermalThrottle)'
    required: false
    default: 'memoryPressure,malformedInput'
  timeout:
    description: 'Timeout in seconds for each test iteration'
    required: false
    default: '30'
  output-format:
    description: 'Output format (json, markdown, or html)'
    required: false
    default: 'json'
  fail-threshold:
    description: 'Minimum acceptable pass rate between 0.0 and 1.0 (fails workflow if below)'
    required: false
    default: '0.0'

outputs:
  report-path:
    description: 'File path to the generated stress report'
    value: ${{ steps.run-stress.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Install Dependencies
      run: |
        cd packages/sate_core && dart pub get && cd ../..
        cd packages/sate_cli && dart pub get && cd ../..
      shell: bash

    - name: Activate SATE AI CLI Globally
      run: |
        flutter pub global activate --source=path packages/sate_cli
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      shell: bash

    - name: Run SATE AI Stress Test
      id: run-stress
      run: |
        export PATH="$PATH":"$HOME/.pub-cache/bin"
        REPORT_EXT="json"
        MARKDOWN_FLAG=""
        if [ "${{ inputs.output-format }}" = "markdown" ]; then
          REPORT_EXT="md"
          MARKDOWN_FLAG="--markdown"
        fi
        REPORT_FILE="stress-report.${REPORT_EXT}"
        sate_ai stress \
          --model "${{ inputs.model-path }}" \
          --injectors "${{ inputs.injectors }}" \
          --timeout "${{ inputs.timeout }}" \
          --output "${REPORT_FILE}" \
          ${MARKDOWN_FLAG}
        echo "report-file=${REPORT_FILE}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: sate-ai-report
        path: stress-report.*
