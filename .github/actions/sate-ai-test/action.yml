name: 'SATE AI Test'
description: 'Run SATE AI stress tests on your AI model'
author: 'assassinaj602'

inputs:
  model-path:
    description: 'Path to the AI model file'
    required: true
  injectors:
    description: 'Comma-separated list of injectors to use'
    required: false
    default: 'memoryPressure,malformedInput'
  timeout:
    description: 'Timeout in seconds for each test'
    required: false
    default: '30'
  output-format:
    description: 'Output format (json or markdown)'
    required: false
    default: 'json'

runs:
  using: 'composite'
  steps:
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: 'stable'

    - name: Install Dependencies
      run: dart pub get
      shell: bash

    - name: Run SATE AI Stress Test
      run: |
        dart run bin/sate_ai.dart \
          --model "${{ inputs.model-path }}" \
          --injectors "${{ inputs.injectors }}" \
          --timeout "${{ inputs.timeout }}" \
          --output stress-report.${{ inputs.output-format == 'markdown' && 'md' || 'json' }} \
          ${{ inputs.output-format == 'markdown' && '--markdown' || '' }}
      shell: bash

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: sate-ai-report
        path: stress-report.*
