name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    name: Welcome new contributors
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue on **SATE AI**!

            Here's what happens next:
            - A maintainer will review it within a few days.
            - If this is a bug, please make sure you've included steps to reproduce.
            - If this is a feature request, check the [Roadmap](../../README.md#roadmap) first.

            In the meantime, check out [CONTRIBUTING.md](../../CONTRIBUTING.md) if you'd like to fix it yourself!
          pr-message: |
            🎉 Thanks for opening your first pull request on **SATE AI** — welcome!

            Please make sure you've:
            - [ ] Run `flutter test` and all tests pass
            - [ ] Run `flutter analyze` with no issues
            - [ ] Run `dart format lib/ test/`
            - [ ] Added a CHANGELOG entry

            A maintainer will review your PR shortly. Thank you for contributing! 🚀
