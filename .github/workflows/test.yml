name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install CMake 3.31.0
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-linux-x86_64.tar.gz
          tar -xzf cmake-3.31.0-linux-x86_64.tar.gz
          sudo mv cmake-3.31.0-linux-x86_64 /opt/cmake-3.31.0
          echo "/opt/cmake-3.31.0/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify CMake version
        run: cmake --version
        shell: bash

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/tools/bin/sdkmanager"
          fi
          yes | $SDKMANAGER --licenses || true
        shell: bash

      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/tools/bin/sdkmanager"
          fi
          $SDKMANAGER "ndk;28.0.12433566"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.12433566" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build example app
        run: |
          cd example
          flutter pub get
          flutter build apk --debug

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Publish package
        run: dart pub publish --force
