name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        shell: bash

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
        shell: bash

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.0.12433566"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.12433566" >> $GITHUB_ENV
        shell: bash

      - name: Install CMake 3.31.0
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v3.31.0/cmake-3.31.0-linux-x86_64.tar.gz
          tar -xzf cmake-3.31.0-linux-x86_64.tar.gz
          sudo mv cmake-3.31.0-linux-x86_64 /opt/cmake-3.31.0
          echo "/opt/cmake-3.31.0/bin" >> $GITHUB_PATH
        shell: bash

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          sdkmanager --list | head -10
        shell: bash

      - name: Create local.properties for Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > example/android/local.properties
          cat example/android/local.properties
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build example app
        run: |
          cd example
          flutter pub get
          flutter build apk --debug
        shell: bash

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Publish package
        run: dart pub publish --force
