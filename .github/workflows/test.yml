name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  sate-core:
    name: sate_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sate_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  sate-cli:
    name: sate_cli (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sate_cli
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install core dependencies
        working-directory: packages/sate_core
        run: dart pub get

      - name: Install dependencies
        run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  sate-ai:
    name: sate_ai (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sate_ai
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install core dependencies
        working-directory: packages/sate_core
        run: dart pub get

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  sate-ai-android:
    name: sate_ai example app build
    runs-on: ubuntu-latest
    needs: [ sate-ai ]
    defaults:
      run:
        working-directory: packages/sate_ai/example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        shell: bash

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
        shell: bash

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.0.12433566"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.12433566" >> $GITHUB_ENV
        shell: bash

      - name: Install CMake 3.31.0
        run: |
          sdkmanager "cmake;3.31.0"
        shell: bash

      - name: Create local.properties for Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

  publish:
    needs: [ sate-core, sate-cli, sate-ai, sate-ai-android ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: packages/sate_ai
        run: flutter pub get

      - name: Publish package
        working-directory: packages/sate_ai
        run: dart pub publish --force
