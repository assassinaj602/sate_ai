name: AI Model Testing

# Verified: Using sate-ai-test composite action fixes the velocity_tracker.dart
# dependency issue by activating the CLI tool via 'flutter pub global activate'.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-ai-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test AI Model with SATE AI
        uses: ./.github/actions/sate-ai-test
        with:
          model-path: 'models/dummy.gguf'
          injectors: 'memoryPressure,malformedInput,quantizationDrift'
          timeout: '60'
          output-format: 'json'
