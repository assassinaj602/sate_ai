name: AI Model Testing

on:
  push:
    branches:
      - main
    paths:
      - 'models/**'
      - '.github/actions/sate-ai-test/**'
      - '.github/workflows/ai-test-example.yml'
      - 'bin/**'
      - 'lib/**'
  pull_request:
    paths:
      - 'models/**'


jobs:
  test-ai-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test AI Model with SATE AI
        uses: ./.github/actions/sate-ai-test
        with:
          model-path: 'models/dummy.gguf'
          injectors: 'memoryPressure,malformedInput,quantizationDrift'
          timeout: '60'
          output-format: 'json'
